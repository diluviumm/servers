name: Fork Custom Servers CI

# CI untuk server custom fork ini (src/status, src/owasp) — terpisah dari
# workflow upstream agar merge upstream tidak pernah menyentuh file ini.
on:
  push:
    branches: [main]
    paths:
      - "src/status/**"
      - "src/owasp/**"
      - "src/niri/**"
      - "src/portal/**"
      - ".github/workflows/fork-ci.yml"
  pull_request:
    paths:
      - "src/status/**"
      - "src/owasp/**"
      - "src/niri/**"
      - "src/portal/**"
      - ".github/workflows/fork-ci.yml"
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [status, owasp, niri, portal]
        python: ["3.10", "3.12"]
    name: ${{ matrix.package }} . py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"

      - name: Sync (frozen lockfile)
        working-directory: src/${{ matrix.package }}
        run: uv sync --frozen --all-extras --dev

      - name: Pytest (with coverage gate)
        working-directory: src/${{ matrix.package }}
        run: uv run pytest -q --cov=. --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml

      - name: Ruff
        working-directory: src/${{ matrix.package }}
        run: uv run ruff check .

      - name: Pyright
        working-directory: src/${{ matrix.package }}
        run: uv run --frozen pyright

      - name: Build
        working-directory: src/${{ matrix.package }}
        run: uv build

      - name: Upload coverage artifact (riwayat per run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}-py${{ matrix.python }}
          path: src/${{ matrix.package }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 90
