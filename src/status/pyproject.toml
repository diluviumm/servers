[project]
name = "hermes-mcp-status"
version = "0.1.0"
description = "MCP server: health checks for a self-hosted Hermes Agent stack"
requires-python = ">=3.10"
dependencies = ["mcp<2", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = ["pyright>=1.1.407", "ruff>=0.7.3", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
