[project]
name = "hermes-mcp-portal"
version = "0.1.0"
description = "MCP server: desktop screenshot (Niri) + clipboard read/write"
requires-python = ">=3.10"
dependencies = ["mcp<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = ["pytest-cov>=5.0", "pyright>=1.1.407", "ruff>=0.7.3", "pytest>=8.0.0"]

[tool.pytest.ini_options]
addopts = "--cov-fail-under=75"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
